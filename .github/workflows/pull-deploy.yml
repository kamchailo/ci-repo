name: Deploy to TestFlight (Proxy)

on:
  repository_dispatch:
    types: [deploy]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: macos-15
    timeout-minutes: 45

    env:
      TEAM_ID: ${{ secrets.TEAM_ID }}
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}

    steps:
      - name: Resolve job manifest
        id: manifest
        env:
          PAT: ${{ secrets.PRIVATE_REPO_PAT }}
          JOB_ID: ${{ github.event.client_payload.job_id }}
        run: |
          if [ -z "$JOB_ID" ]; then
            echo "❌ No job_id in client_payload"
            exit 1
          fi

          # Fetch manifest from private repo ci-jobs branch
          RESPONSE=$(curl -sf \
            -H "Authorization: token ${PAT}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${PRIVATE_REPO}/contents/.ci-jobs/${JOB_ID}.json?ref=ci-jobs")

          # Decode manifest content (base64 with possible newlines)
          MANIFEST=$(echo "$RESPONSE" | jq -r '.content' | base64 -d)

          REF=$(echo "$MANIFEST" | jq -r '.ref')
          PR_NUMBER=$(echo "$MANIFEST" | jq -r '.pr_number // empty')

          # Mask all sensitive values
          echo "::add-mask::${TEAM_ID}"
          echo "::add-mask::$REF"
          if [ -n "$PR_NUMBER" ]; then
            echo "::add-mask::$PR_NUMBER"
          fi

          # Validate before GITHUB_ENV writes
          if ! printf '%s' "$REF" | LC_ALL=C grep -qE '^[a-zA-Z0-9_./-]+$'; then
            echo "❌ Invalid REF format"; exit 1
          fi
          if [ -n "$PR_NUMBER" ] && ! printf '%s' "$PR_NUMBER" | LC_ALL=C grep -qE '^[0-9]+$'; then
            echo "❌ Invalid PR_NUMBER format"; exit 1
          fi

          # Export to env for subsequent steps
          echo "REF=$REF" >> "$GITHUB_ENV"
          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"

      - name: Clone private repo
        env:
          PAT: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          git clone --depth 1 --branch "$REF" \
            "https://x-access-token:${PAT}@github.com/${PRIVATE_REPO}.git" source 2>/dev/null
          echo "✅ Source cloned"

      - name: Report pending status
        env:
          PAT: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          cd source
          SHA=$(git rev-parse HEAD)
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          echo "::add-mask::$SHA"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          jq -n --arg state "pending" --arg url "$RUN_URL" --arg desc "Deploy in progress" --arg ctx "deploy/ci-repo" \
            '{state: $state, target_url: $url, description: $desc, context: $ctx}' \
            > $RUNNER_TEMP/status-payload.json
          curl -s -X POST \
            -H "Authorization: token ${PAT}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${PRIVATE_REPO}/statuses/${SHA}" \
            -d @$RUNNER_TEMP/status-payload.json -o /dev/null -w "HTTP Status: %{http_code}\n"

      - name: Select Xcode
        run: |
          # Prefer Xcode 26 for App Store uploads
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          fi
          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: source
        run: xcodegen generate > /dev/null 2>&1

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: source

      - name: Install Fastlane
        working-directory: source
        run: bundle install --quiet > /dev/null 2>&1

      - name: Import certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null 2>&1
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH" > /dev/null 2>&1
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null 2>&1

          CERT_PATH=$RUNNER_TEMP/certificate.p12
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" \
            -P "$CERT_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH" > /dev/null 2>&1 || { echo "❌ Failed to import certificate"; exit 1; }
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null 2>&1
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db > /dev/null 2>&1

      - name: Import provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.PROFILE_BASE64 }}
        run: |
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          # Extract UUID and Name from profile (Xcode requires <UUID>.mobileprovision)
          PROFILE_PLIST=$(security cms -D -i "$PROFILE_PATH") || { echo "❌ Failed to decode provisioning profile"; exit 1; }
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" /dev/stdin <<< "$PROFILE_PLIST")
          if [ -z "$PROFILE_UUID" ]; then echo "❌ Could not extract UUID from profile"; exit 1; fi
          if ! [[ "$PROFILE_UUID" =~ ^[A-Fa-f0-9]{8}-[A-Fa-f0-9]{4}-[A-Fa-f0-9]{4}-[A-Fa-f0-9]{4}-[A-Fa-f0-9]{12}$ ]]; then
            echo "❌ Invalid provisioning profile UUID format"; exit 1
          fi
          if [ -z "$PROFILE_NAME" ]; then echo "❌ Could not extract Name from profile"; exit 1; fi
          if printf '%s' "$PROFILE_NAME" | LC_ALL=C grep -q '[^[:print:]]'; then
            echo "❌ Profile name contains invalid characters"; exit 1
          fi
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" /dev/stdin <<< "$PROFILE_PLIST" | sed 's/^[A-Z0-9]*\.//')
          if [ -z "$BUNDLE_ID" ]; then echo "❌ Could not extract bundle ID from profile"; exit 1; fi
          if printf '%s' "$BUNDLE_ID" | LC_ALL=C grep -q '[^[:print:]]'; then
            echo "❌ Bundle ID contains invalid characters"; exit 1
          fi
          if ! [[ "$BUNDLE_ID" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]; then
            echo "❌ Invalid bundle ID format"; exit 1
          fi
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"${PROFILE_UUID}.mobileprovision" > /dev/null 2>&1
          echo "::add-mask::$PROFILE_UUID"
          echo "::add-mask::$PROFILE_NAME"
          echo "::add-mask::$BUNDLE_ID"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"
          echo "✅ Profile installed (UUID and bundle ID masked)"

      - name: Generate ExportOptions.plist
        run: |
          PLIST_PATH="$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy \
            -c "Add :method string app-store" \
            -c "Add :teamID string ${TEAM_ID}" \
            -c "Add :signingStyle string manual" \
            -c "Add :signingCertificate string Apple Distribution" \
            -c "Add :provisioningProfiles dict" \
            -c "Add :provisioningProfiles:${BUNDLE_ID} string ${PROFILE_NAME}" \
            "$PLIST_PATH"
          echo "✅ ExportOptions.plist generated"

      - name: Create App Store Connect API key
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        working-directory: source
        run: |
          mkdir -p fastlane/keys
          echo "$ASC_KEY_BASE64" | base64 --decode > "fastlane/keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Build and upload to TestFlight
        working-directory: source
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          # Backslash-space in CODE_SIGN_IDENTITY survives double quotes; xcodebuild interprets it
          export GYM_XCARGS="PROVISIONING_PROFILE=${PROFILE_UUID} CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=Apple\ Distribution DEVELOPMENT_TEAM=${TEAM_ID}"
          export GYM_EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          set +e
          bundle exec fastlane beta 2>&1 | tee deploy.log > /dev/null
          FASTLANE_EXIT=${PIPESTATUS[0]}
          set -e
          if [ "$FASTLANE_EXIT" -ne 0 ]; then
            echo "❌ Fastlane exited with code $FASTLANE_EXIT"
            exit "$FASTLANE_EXIT"
          fi
          # Verify fastlane actually started the beta lane
          if [ -f deploy.log ] && ! grep -q 'Driving the lane' deploy.log; then
            echo "❌ Fastlane did not start the beta lane — deploy.log may be incomplete"
            exit 1
          fi
          echo "✅ Upload to TestFlight complete"

      - name: Sanitize deploy error summary
        if: failure()
        working-directory: source
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          if [ ! -f deploy.log ]; then
            echo "DEPLOY_ERROR_DETAIL=No deploy.log found" >> "$GITHUB_ENV"
            exit 0
          fi

          # Extract only error-relevant lines
          ERRORS=$(grep -E '\[\!\]|error:|FAILED|fatal|Could not|BUILD FAILED|ARCHIVE FAILED' deploy.log || true)

          if [ -z "$ERRORS" ]; then
            echo "DEPLOY_ERROR_DETAIL=Build failed but no specific error lines captured" >> "$GITHUB_ENV"
            exit 0
          fi

          # Sanitize pipeline — defense-in-depth
          SANITIZED=$(echo "$ERRORS" | sed -E \
            -e 's#/Users/[^ "]*#<path>#g' \
            -e 's#/private/var/[^ "]*#<path>#g' \
            -e 's#/var/folders/[^ "]*#<path>#g' \
            -e 's#[^ ":]*/source/[^ "]*#<path>#g' \
            -e 's#/Applications/Xcode[^ "]*#<xcode>#g' \
            -e 's#/[a-zA-Z][a-zA-Z0-9._/-]{4,}/[^ "]*#<path>#g' \
            -e 's#[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}#<uuid>#g' \
            -e 's#(Apple|iPhone) (Development|Distribution): [^]")]*#\1 \2: <redacted>#g' \
            -e 's#signingCertificate *= *[^;) ]*#signingCertificate=<redacted>#g' \
            -e 's#PROVISIONING_PROFILE[^ =]*=[^ ")]*#PROVISIONING_PROFILE=<redacted>#g' \
            -e 's#DEVELOPMENT_TEAM *= *[^ ")]*#DEVELOPMENT_TEAM=<redacted>#g' \
          )

          # Belt-and-braces: redact actual secret values if they leaked
          if [ -n "$ASC_KEY_ID" ]; then
            SANITIZED="${SANITIZED//$ASC_KEY_ID/<asc-key>}"
          fi
          if [ -n "$ASC_ISSUER_ID" ]; then
            SANITIZED="${SANITIZED//$ASC_ISSUER_ID/<asc-issuer>}"
          fi
          if [ -n "$TEAM_ID" ]; then
            SANITIZED="${SANITIZED//$TEAM_ID/<team-id>}"
          fi

          # Strip backticks (break markdown injection)
          SANITIZED=$(echo "$SANITIZED" | tr '`' "'")

          # Cap at 60 lines / 4096 bytes
          SANITIZED=$(echo "$SANITIZED" | head -60 | head -c 4096)

          # Prevent heredoc delimiter injection (attacker-controlled build errors could
          # contain the literal delimiter, terminating heredoc and injecting into GITHUB_ENV)
          SANITIZED=$(printf '%s' "$SANITIZED" | sed 's/__SANITIZED_EOF__/[REDACTED]/g')

          {
            echo "DEPLOY_ERROR_DETAIL<<__SANITIZED_EOF__"
            printf '%s' "$SANITIZED"
            echo
            echo "__SANITIZED_EOF__"
          } >> "$GITHUB_ENV"

      - name: Extract build info
        if: always()
        working-directory: source
        run: |
          BUILD_NUM="unknown"
          VERSION="unknown"
          APP_NAME="App"
          DEPLOY_TS=$(date -u '+%Y-%m-%d %H:%M UTC')

          if [ -f deploy.log ]; then
            # Build number — fastlane logs "Incrementing build number to N" or "build_number: N"
            for pattern in \
              'Incrementing build number to [0-9]' \
              'build_number.*[0-9]' \
              'CFBundleVersion.*[0-9]' \
              'Setting.*build.*number.*[0-9]'; do
              val=$(grep -i "$pattern" deploy.log | grep -oE '[0-9]+' | tail -1 || true)
              if [ -n "$val" ]; then BUILD_NUM="$val"; break; fi
            done

            # Version — from CFBundleShortVersionString or IPA filename
            for pattern in \
              'CFBundleShortVersionString' \
              'ShortVersionString' \
              '\.ipa'; do
              val=$(grep -i "$pattern" deploy.log | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1 || true)
              if [ -n "$val" ]; then VERSION="$val"; break; fi
            done

            # App name — from exported IPA path (sanitized: name only, no path)
            ipa_name=$(grep -oE '[A-Za-z0-9_-]+\.ipa' deploy.log | head -1 | sed 's/\.ipa//' || true)
            if [ -n "$ipa_name" ]; then APP_NAME="$ipa_name"; fi
          fi

          # Error extraction for failure diagnostics
          DEPLOY_ERROR=""
          if [ -f deploy.log ]; then
            # First try fastlane's own failure markers
            DEPLOY_ERROR=$(grep -E '^\[\!\]|fastlane finished with errors|\*\* (BUILD|ARCHIVE) FAILED \*\*' deploy.log | tail -1 | sed 's|/[^ ]*source/||g; s|/Users/[^ ]*/||g' | cut -c1-200 || true)
            # Fall back to generic error grep only if fastlane markers not found
            if [ -z "$DEPLOY_ERROR" ]; then
              DEPLOY_ERROR=$(grep -i 'error\|fatal\|failed\|Could not' deploy.log | grep -v '^\s*$' | tail -1 | sed 's|/[^ ]*source/||g; s|/Users/[^ ]*/||g' | cut -c1-200 || true)
            fi
          fi

          echo "BUILD_NUM=$BUILD_NUM" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
          echo "DEPLOY_TS=$DEPLOY_TS" >> "$GITHUB_ENV"
          DEPLOY_ERROR=$(printf '%s' "$DEPLOY_ERROR" | sed 's/__EOF__/[REDACTED]/g')
          {
            echo "DEPLOY_ERROR<<__EOF__"
            printf '%s' "$DEPLOY_ERROR"
            echo
            echo "__EOF__"
          } >> "$GITHUB_ENV"

      - name: Report success status
        if: success()
        env:
          PAT: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          DESC="Deploy succeeded — v${VERSION} (${BUILD_NUM})"
          PAYLOAD=$(jq -n \
            --arg state "success" \
            --arg url "$RUN_URL" \
            --arg desc "$DESC" \
            --arg ctx "deploy/ci-repo" \
            '{state:$state, target_url:$url, description:$desc, context:$ctx}')
          curl -s -X POST \
            -H "Authorization: token ${PAT}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${PRIVATE_REPO}/statuses/${SHA}" \
            -d "$PAYLOAD" -o /dev/null -w "HTTP Status: %{http_code}\n"

      - name: Report failure status
        if: failure()
        env:
          PAT: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          DESC="Deploy failed — ${DEPLOY_ERROR:0:80}"
          PAYLOAD=$(jq -n \
            --arg state "failure" \
            --arg url "$RUN_URL" \
            --arg desc "${DESC:-Deploy failed}" \
            --arg ctx "deploy/ci-repo" \
            '{state:$state, target_url:$url, description:$desc, context:$ctx}')
          curl -s -X POST \
            -H "Authorization: token ${PAT}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${PRIVATE_REPO}/statuses/${SHA}" \
            -d "$PAYLOAD" -o /dev/null -w "HTTP Status: %{http_code}\n"

      - name: Comment deploy result on commit
        if: always()
        env:
          PAT: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "${{ job.status }}" = "success" ]; then
            BODY="✅ **Deploy succeeded** — \`${APP_NAME}\` v${VERSION} (${BUILD_NUM}) uploaded to TestFlight

          📦 **Version:** ${VERSION} | **Build:** ${BUILD_NUM}
          🕐 **Deployed:** ${DEPLOY_TS}
          🔗 [View CI run](${RUN_URL})"
          else
            BODY="❌ **Deploy to TestFlight failed**

          🕐 **Attempted:** ${DEPLOY_TS}
          💥 **Error:** ${DEPLOY_ERROR:-No error details captured}
          🔗 [View CI run](${RUN_URL})"

            if [ -n "$DEPLOY_ERROR_DETAIL" ]; then
              BODY="${BODY}

          <details><summary>Sanitized error detail</summary>

          \`\`\`
          ${DEPLOY_ERROR_DETAIL}
          \`\`\`

          </details>"
            fi
          fi

          jq -n --arg body "$BODY" '{"body": $body}' > $RUNNER_TEMP/deploy-comment.json

          curl -s -X POST \
            -H "Authorization: token ${PAT}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${PRIVATE_REPO}/commits/${SHA}/comments" \
            -d @$RUNNER_TEMP/deploy-comment.json -o /dev/null -w "HTTP Status: %{http_code}\n"

      - name: Comment on PR (success)
        if: success() && env.PR_NUMBER != ''
        env:
          PAT: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          COMMENT_TEXT="✅ **Deploy succeeded** — \`${APP_NAME}\` v${VERSION} (${BUILD_NUM}) uploaded to TestFlight

          📦 **Version:** ${VERSION} | **Build:** ${BUILD_NUM}
          🕐 **Deployed:** ${DEPLOY_TS}
          🔗 [View CI run](${RUN_URL})"

          jq -n --arg body "$COMMENT_TEXT" '{"body": $body}' > $RUNNER_TEMP/comment.json

          curl -s -X POST \
            -H "Authorization: token ${PAT}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${PRIVATE_REPO}/issues/${PR_NUMBER}/comments" \
            -d @$RUNNER_TEMP/comment.json -o /dev/null -w "HTTP Status: %{http_code}\n"

      - name: Comment on PR (failure)
        if: failure() && env.PR_NUMBER != ''
        env:
          PAT: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          COMMENT_TEXT="❌ **Deploy to TestFlight failed**

          🕐 **Attempted:** ${DEPLOY_TS}
          💥 **Error:** ${DEPLOY_ERROR:-No error details captured}
          🔗 [View CI run](${RUN_URL})"

          if [ -n "$DEPLOY_ERROR_DETAIL" ]; then
            COMMENT_TEXT="${COMMENT_TEXT}

          <details><summary>Sanitized error detail</summary>

          \`\`\`
          ${DEPLOY_ERROR_DETAIL}
          \`\`\`

          </details>"
          fi

          jq -n --arg body "$COMMENT_TEXT" '{"body": $body}' > $RUNNER_TEMP/comment.json

          curl -s -X POST \
            -H "Authorization: token ${PAT}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${PRIVATE_REPO}/issues/${PR_NUMBER}/comments" \
            -d @$RUNNER_TEMP/comment.json -o /dev/null -w "HTTP Status: %{http_code}\n"

      - name: Summary
        if: always()
        run: |
          echo "=============================="
          echo "📋 Deploy Summary"
          echo "=============================="
          echo "Build: #${BUILD_NUM:-unknown}"
          echo "Deployed: ${DEPLOY_TS:-n/a}"
          echo "Status: ${{ job.status }}"
          echo "=============================="

      - name: Clean up
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true
          rm -f $RUNNER_TEMP/certificate.p12
          rm -f $RUNNER_TEMP/profile.mobileprovision
          rm -f $RUNNER_TEMP/ExportOptions.plist
          rm -f $RUNNER_TEMP/status-payload.json
          rm -rf source
          rm -f $RUNNER_TEMP/comment.json
          rm -f $RUNNER_TEMP/deploy-comment.json
