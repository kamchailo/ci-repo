name: Build & Test (Proxy)

on:
  repository_dispatch:
    types: [build]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30

    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      SCHEME: ${{ secrets.SCHEME_NAME }}
      TEST_TARGET: ${{ secrets.SCHEME_NAME }}Tests

    steps:
      - name: Resolve job manifest
        id: manifest
        env:
          PAT: ${{ secrets.PRIVATE_REPO_PAT }}
          JOB_ID: ${{ github.event.client_payload.job_id }}
        run: |
          if [ -z "$JOB_ID" ]; then
            echo "❌ No job_id in client_payload"
            exit 1
          fi

          # Fetch manifest from private repo ci-jobs branch
          RESPONSE=$(curl -sf \
            -H "Authorization: token ${PAT}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${PRIVATE_REPO}/contents/.ci-jobs/${JOB_ID}.json?ref=ci-jobs")

          # Decode manifest content (base64 with possible newlines)
          MANIFEST=$(echo "$RESPONSE" | jq -r '.content' | base64 -d)

          REF=$(echo "$MANIFEST" | jq -r '.ref')
          SHA=$(echo "$MANIFEST" | jq -r '.sha')
          PR_NUMBER=$(echo "$MANIFEST" | jq -r '.pr_number')

          # Mask all sensitive values
          echo "::add-mask::$REF"
          echo "::add-mask::$SHA"
          if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
            echo "::add-mask::$PR_NUMBER"
          fi

          # Export to env for subsequent steps
          echo "REF=$REF" >> "$GITHUB_ENV"
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"

      - name: Clone private repo
        env:
          PAT: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          git clone --depth 1 --branch "$REF" \
            "https://x-access-token:${PAT}@github.com/${PRIVATE_REPO}.git" source 2>/dev/null || {
            # Branch clone failed — fall back to SHA checkout
            git clone "https://x-access-token:${PAT}@github.com/${PRIVATE_REPO}.git" source 2>/dev/null
            cd source
            git checkout "$SHA" > /dev/null 2>&1
          }
          echo "✅ Source cloned"

      - name: Report pending status
        env:
          PAT: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST \
            -H "Authorization: token ${PAT}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${PRIVATE_REPO}/statuses/${SHA}" \
            -d "{\"state\":\"pending\",\"target_url\":\"${RUN_URL}\",\"description\":\"Build & test in progress\",\"context\":\"ci/ci-repo\"}" -o /dev/null -w "HTTP Status: %{http_code}\n"

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('source/**/*.swift', 'source/project.yml') }}
          restore-keys: ${{ runner.os }}-deriveddata-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: source
        run: xcodegen generate > /dev/null 2>&1

      - name: Find simulator
        id: sim
        run: |
          DEST=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              for d in devices:
                  if d['isAvailable'] and 'iPhone' in d['name']:
                      print(d['udid'])
                      sys.exit(0)
          " 2>/dev/null)
          echo "id=$DEST" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $DEST"

      - name: Build
        working-directory: source
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log > /dev/null
          echo "✅ Build succeeded"

      - name: Test
        working-directory: source
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -configuration Debug \
            -only-testing:"$TEST_TARGET" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath TestResults.xcresult \
            2>&1 | tee test.log > /dev/null

      - name: Sanitize build/test log
        if: always()
        working-directory: source
        env:
          SCHEME: ${{ secrets.SCHEME_NAME }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          LOG_FILE=""
          if [ -f test.log ]; then
            LOG_FILE="test.log"
          elif [ -f build.log ]; then
            LOG_FILE="build.log"
          fi

          if [ -z "$LOG_FILE" ]; then
            echo "SANITIZED_LOG=No log file found" >> "$GITHUB_ENV"
            exit 0
          fi

          if [ "${{ job.status }}" = "success" ]; then
            # Success: keep test results summary lines
            EXTRACTED=$(grep -E 'Test Suite|Test Case|passed|failed|Executed|error:|FAILED|Build complete|BUILD SUCCEEDED' "$LOG_FILE" || true)
          else
            # Failure: error lines only
            EXTRACTED=$(grep -E '\[\!\]|error:|FAILED|fatal|Could not|BUILD FAILED|ARCHIVE FAILED|undefined symbol|linker|cannot find' "$LOG_FILE" || true)
          fi

          if [ -z "$EXTRACTED" ]; then
            EXTRACTED="(no matching log lines captured)"
          fi

          # Sanitize pipeline — defense-in-depth
          SANITIZED=$(echo "$EXTRACTED" | sed -E \
            -e 's|/Users/[^ "]*|<path>|g' \
            -e 's|/private/var/[^ "]*|<path>|g' \
            -e 's|/var/folders/[^ "]*|<path>|g' \
            -e 's|[^ ":]*/source/[^ "]*|<path>|g' \
            -e 's|/Applications/Xcode[^ "]*|<xcode>|g' \
            -e 's|/[a-zA-Z][a-zA-Z0-9._/-]{4,}/[^ "]*|<path>|g' \
            -e 's|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}|<uuid>|g' \
            -e 's|(Apple|iPhone) (Development|Distribution): [^")\]]*|\1 \2: <redacted>|g' \
            -e 's|signingCertificate *= *[^;) ]*|signingCertificate=<redacted>|g' \
            -e 's|PROVISIONING_PROFILE[^ =]*=[^ ")]*|PROVISIONING_PROFILE=<redacted>|g' \
            -e 's|DEVELOPMENT_TEAM *= *[^ ")]*|DEVELOPMENT_TEAM=<redacted>|g' \
          )

          # Strip backticks (break markdown injection)
          SANITIZED=$(echo "$SANITIZED" | tr '`' "'")

          # Belt-and-braces: redact actual secret values if they leaked
          if [ -n "$SCHEME" ]; then
            SANITIZED=$(printf '%s' "$SANITIZED" | sed "s|${SCHEME}|[SCHEME]|g")
          fi
          if [ -n "$TEAM_ID" ]; then
            SANITIZED=$(printf '%s' "$SANITIZED" | sed "s|${TEAM_ID}|<team-id>|g")
          fi

          # Cap at 60 lines / 8192 bytes
          SANITIZED=$(echo "$SANITIZED" | head -60 | head -c 8192)

          # Prevent heredoc delimiter injection (attacker-controlled build errors could
          # contain the literal delimiter, terminating heredoc and injecting into GITHUB_ENV)
          SANITIZED=$(printf '%s' "$SANITIZED" | sed 's/__SANITIZED_EOF__/[REDACTED]/g')

          {
            echo "SANITIZED_LOG<<__SANITIZED_EOF__"
            printf '%s' "$SANITIZED"
            echo
            echo "__SANITIZED_EOF__"
          } >> "$GITHUB_ENV"

      - name: Report success status
        if: success()
        env:
          PAT: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST \
            -H "Authorization: token ${PAT}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${PRIVATE_REPO}/statuses/${SHA}" \
            -d "{\"state\":\"success\",\"target_url\":\"${RUN_URL}\",\"description\":\"Build & test passed\",\"context\":\"ci/ci-repo\"}" -o /dev/null -w "HTTP Status: %{http_code}\n"

      - name: Report failure status
        if: failure()
        env:
          PAT: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST \
            -H "Authorization: token ${PAT}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${PRIVATE_REPO}/statuses/${SHA}" \
            -d "{\"state\":\"failure\",\"target_url\":\"${RUN_URL}\",\"description\":\"Build or test failed\",\"context\":\"ci/ci-repo\"}" -o /dev/null -w "HTTP Status: %{http_code}\n"

      - name: Comment on PR (success)
        if: success() && env.PR_NUMBER != ''
        env:
          PAT: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          COMMENT_TEXT="✅ **Build & tests passed**"
          if [ -n "$SANITIZED_LOG" ]; then
            COMMENT_TEXT="${COMMENT_TEXT}

          <details><summary>Test summary</summary>

          \`\`\`
          ${SANITIZED_LOG}
          \`\`\`

          </details>"
          fi
          COMMENT_TEXT="${COMMENT_TEXT}

          [View run](${RUN_URL})"

          jq -n --arg body "$COMMENT_TEXT" '{"body": $body}' > $RUNNER_TEMP/comment.json

          curl -s -X POST \
            -H "Authorization: token ${PAT}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${PRIVATE_REPO}/issues/${PR_NUMBER}/comments" \
            -d @$RUNNER_TEMP/comment.json -o /dev/null -w "HTTP Status: %{http_code}\n"

      - name: Comment on PR (failure)
        if: failure() && env.PR_NUMBER != ''
        env:
          PAT: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          COMMENT_TEXT="❌ **Build or tests failed**"
          if [ -n "$SANITIZED_LOG" ]; then
            COMMENT_TEXT="${COMMENT_TEXT}

          <details><summary>Sanitized error detail</summary>

          \`\`\`
          ${SANITIZED_LOG}
          \`\`\`

          </details>"
          fi
          COMMENT_TEXT="${COMMENT_TEXT}

          [View run](${RUN_URL})"

          jq -n --arg body "$COMMENT_TEXT" '{"body": $body}' > $RUNNER_TEMP/comment.json

          curl -s -X POST \
            -H "Authorization: token ${PAT}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${PRIVATE_REPO}/issues/${PR_NUMBER}/comments" \
            -d @$RUNNER_TEMP/comment.json -o /dev/null -w "HTTP Status: %{http_code}\n"

      - name: Summary
        if: always()
        run: |
          echo "=============================="
          echo "📋 Build & Test Summary"
          echo "=============================="
          echo "Status: ${{ job.status }}"
          echo "=============================="

      - name: Clean up
        if: always()
        run: |
          rm -rf source
          rm -f $RUNNER_TEMP/comment.json
