name: Build & Test (Proxy)

on:
  repository_dispatch:
    types: [build]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30

    env:
      REF: ${{ github.event.client_payload.ref }}
      SHA: ${{ github.event.client_payload.sha }}
      PR_NUMBER: ${{ github.event.client_payload.pr_number }}
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      SCHEME: ${{ secrets.SCHEME_NAME }}
      TEST_TARGET: ${{ secrets.SCHEME_NAME }}Tests

    steps:
      - name: Mask sensitive values
        run: |
          echo "::add-mask::${REF}"
          echo "::add-mask::${SHA}"
          echo "::add-mask::${PR_NUMBER}"

      - name: Clone private repo
        env:
          PAT: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          git clone --depth 1 --branch "$REF" \
            "https://x-access-token:${PAT}@github.com/${PRIVATE_REPO}.git" source 2>/dev/null || {
            # Branch clone failed — fall back to SHA checkout
            git clone "https://x-access-token:${PAT}@github.com/${PRIVATE_REPO}.git" source 2>/dev/null
            cd source
            git checkout "$SHA" 2>/dev/null
          }
          echo "✅ Source cloned"

      - name: Report pending status
        env:
          PAT: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST \
            -H "Authorization: token ${PAT}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${PRIVATE_REPO}/statuses/${SHA}" \
            -d "{\"state\":\"pending\",\"target_url\":\"${RUN_URL}\",\"description\":\"Build & test in progress\",\"context\":\"ci/ci-repo\"}" > /dev/null

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('source/**/*.swift', 'source/project.yml') }}
          restore-keys: ${{ runner.os }}-deriveddata-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: source
        run: xcodegen generate

      - name: Find simulator
        id: sim
        run: |
          DEST=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              for d in devices:
                  if d['isAvailable'] and 'iPhone' in d['name']:
                      print(d['udid'])
                      sys.exit(0)
          " 2>/dev/null)
          echo "id=$DEST" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $DEST"

      - name: Build
        working-directory: source
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log > /dev/null
          echo "✅ Build succeeded"

      - name: Test
        working-directory: source
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -configuration Debug \
            -only-testing:"$TEST_TARGET" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath TestResults.xcresult \
            2>&1 | tee test.log > /dev/null

      - name: Report success status
        if: success()
        env:
          PAT: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST \
            -H "Authorization: token ${PAT}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${PRIVATE_REPO}/statuses/${SHA}" \
            -d "{\"state\":\"success\",\"target_url\":\"${RUN_URL}\",\"description\":\"Build & test passed\",\"context\":\"ci/ci-repo\"}" > /dev/null

      - name: Report failure status
        if: failure()
        env:
          PAT: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST \
            -H "Authorization: token ${PAT}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${PRIVATE_REPO}/statuses/${SHA}" \
            -d "{\"state\":\"failure\",\"target_url\":\"${RUN_URL}\",\"description\":\"Build or test failed\",\"context\":\"ci/ci-repo\"}" > /dev/null

      - name: Comment on PR (success)
        if: success() && env.PR_NUMBER != ''
        env:
          PAT: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          COMMENT_TEXT="✅ **Build & tests passed**"
          if [ -f source/test.log ]; then
            LOG_CONTENT=$(head -c 60000 source/test.log)
            COMMENT_TEXT="${COMMENT_TEXT}

          <details><summary>Full test log</summary>

          \`\`\`
          ${LOG_CONTENT}
          \`\`\`"
            if [ "$(wc -c < source/test.log)" -gt 60000 ]; then
              COMMENT_TEXT="${COMMENT_TEXT}

          ⚠️ Log truncated (exceeded 60KB)"
            fi
            COMMENT_TEXT="${COMMENT_TEXT}
          </details>"
          fi
          COMMENT_TEXT="${COMMENT_TEXT}

          [View run](${RUN_URL})"

          jq -n --arg body "$COMMENT_TEXT" '{"body": $body}' > $RUNNER_TEMP/comment.json

          curl -s -X POST \
            -H "Authorization: token ${PAT}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${PRIVATE_REPO}/issues/${PR_NUMBER}/comments" \
            -d @$RUNNER_TEMP/comment.json -w "\nHTTP Status: %{http_code}\n"

      - name: Comment on PR (failure)
        if: failure() && env.PR_NUMBER != ''
        env:
          PAT: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Grab full log content (test log preferred, fall back to build log)
          COMMENT_TEXT="❌ **Build or tests failed**"
          LOG_FILE=""
          if [ -f source/test.log ]; then
            LOG_FILE="source/test.log"
            LOG_LABEL="Full build/test log"
          elif [ -f source/build.log ]; then
            LOG_FILE="source/build.log"
            LOG_LABEL="Full build/test log"
          fi

          if [ -n "$LOG_FILE" ]; then
            LOG_CONTENT=$(head -c 60000 "$LOG_FILE")
            COMMENT_TEXT="${COMMENT_TEXT}

          <details><summary>${LOG_LABEL}</summary>

          \`\`\`
          ${LOG_CONTENT}
          \`\`\`"
            if [ "$(wc -c < "$LOG_FILE")" -gt 60000 ]; then
              COMMENT_TEXT="${COMMENT_TEXT}

          ⚠️ Log truncated (exceeded 60KB)"
            fi
            COMMENT_TEXT="${COMMENT_TEXT}
          </details>"
          fi
          COMMENT_TEXT="${COMMENT_TEXT}

          [View run](${RUN_URL})"

          jq -n --arg body "$COMMENT_TEXT" '{"body": $body}' > $RUNNER_TEMP/comment.json

          curl -s -X POST \
            -H "Authorization: token ${PAT}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${PRIVATE_REPO}/issues/${PR_NUMBER}/comments" \
            -d @$RUNNER_TEMP/comment.json > /dev/null

      - name: Summary
        if: always()
        run: |
          echo "=============================="
          echo "📋 Build & Test Summary"
          echo "=============================="
          echo "PR: #${PR_NUMBER:-n/a}"
          echo "SHA: ${SHA:0:7}"
          if [ -f source/test.log ]; then
            PASSED=$(grep -c "^✔" source/test.log 2>/dev/null || echo 0)
            FAILED=$(grep -c "^✘" source/test.log 2>/dev/null || echo 0)
            echo "Tests: ✅ ${PASSED} passed, ❌ ${FAILED} failed"
          else
            echo "Tests: ⚠️ No test log found"
          fi
          echo "Status: ${{ job.status }}"
          echo "=============================="

      - name: Clean up
        if: always()
        run: |
          rm -rf source
          rm -f $RUNNER_TEMP/comment.json
